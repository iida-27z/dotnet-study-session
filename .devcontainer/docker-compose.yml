services:
  dev:
    build:
      context: ./docker/csharp
      dockerfile: ./Dockerfile
    user: dev
    working_dir: /workspace/app
    ports:
      - 5000:5000
      - 5001:5001
    environment:
      TZ: ${TZ}
      ConnectionStrings__DefaultConnection: "Host=${POSTGRES_HOST};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${APP_USER};Password=${APP_PASSWORD};"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      APP_SCHEMA: ${APP_SCHEMA}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      DOCKER_HOST: tcp://docker:2375
    volumes:
      - ../:/workspace/app
    networks:
      default:
    depends_on:
      db:
        condition: service_healthy
      docker:
        condition: service_started
  db:
    build:
      context: ./docker/postgres
      dockerfile: ./Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      APP_SCHEMA: ${APP_SCHEMA}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      default:
        aliases:
          - ${POSTGRES_HOST}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 10
  docker:
    build:
      context: ./docker/docker
      dockerfile: Dockerfile
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
      - TZ=${TZ}
    networks:
      default:
        aliases:
          - docker

networks:
  default:
    driver: bridge
